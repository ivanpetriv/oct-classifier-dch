[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oct"
version = "0.4.0"
description = "OCT image classification"
dependencies = [
    # Images
    "pillow>=12.2.0",
    "opencv-python>=4.13.0",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.8.0",
    "pywavelets",

    # Visual
    "seaborn>=0.13.0",
    "matplotlib>=3.10.0",
    "rich>=15.0",

    # Data
    "numpy>=2.4.4",
    "statsmodels",
    
    "joblib>=1.5.0",

    "pydantic>=2.13.0",
    "pyyaml",
    "python-dotenv",

    "maturin>=1.13.0",

    # Tests
    "pytest",
    "pytest-benchmark",
    "psutil>=5.9.0",

    "optuna",
]

[project.scripts]
run-oct = "main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
env = [
    "OMP_NUM_THREADS=1",
    "OPENBLAS_NUM_THREADS=1",
    "MKL_NUM_THREADS=1",
    "RAYON_NUM_THREADS=1",
]
testpaths = ["tests"]
pythonpath = ["src"]
