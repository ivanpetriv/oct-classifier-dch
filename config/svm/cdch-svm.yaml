random_state: 42

dataset:
  classes:
    NORMAL: "NORMAL"
    CNV: "CNV"
    DRUSEN: "DRUSEN"
    DME: "DME"
  max_samples_per_class: 3000

preprocessing:
  - corner_artifact_remover:
      min_threshold: 217
      approximation_epsilon: 0.01
      max_area_ratio: 0.50
      ksize: [5, 5]
  - dwt_denoiser:
      method: "VisuShrink"
      wavelet: "sym2"
      mode: "soft"
      wavelet_levels: 1
      rescale_sigma: false
      channel_axis: -1
  - rpe_roi_aligner:
      roi_above: 137
      roi_below: 51
      blur_sigma: 6
      max_jump: 10
      poly_degree: 6
  - resizer:
      target_size: [256, 120]

feature_extraction:
  - cdch:
      angle_step: 5
      center: [0.44, 0.55]
      pixel_range: [30, 222]
      bins: 256

dimensionality_reduction:
  - pca:
      n_components: 87
      whiten: false
      svd_solver: "randomized"
      random_state: 42
      iterated_power: 3
      power_iteration_normalizer: "LU"

classification:
  - svm:
      kernel: "rbf"
      C: 1.9179538838424386
      gamma: 2.3558479236930363e-05
      class_weight: "balanced"
      probability: true
      shrinking: false
      degree: 5
